[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent-companion"
version = "1.0.0"
description = "Open Agent Companion: local desktop companion for agents and CLIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.scripts]
companion = "companion.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
websocket = ["websockets>=12"]
notify = ["plyer>=2"]
build = ["pyinstaller>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
